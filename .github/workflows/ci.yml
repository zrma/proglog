name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
      - name: Generate test certificates
        env:
          GOBIN: ${{ runner.temp }}/proglog-bin
        run: |
          bash setup-cert.sh
          PATH="$GOBIN:$PATH" bash generate-cert.sh
      - run: go vet ./...
      - run: go test ./...
